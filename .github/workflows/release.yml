name: Release

# 推送 v* 标签时自动编译、打包自包含发行包，并创建 GitHub Release
# 也可在 Actions 页面手动 Run workflow，指定标签重发某个版本
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v1.0.1），留空则用当前引用'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 打包自包含发行包
        shell: pwsh
        run: ./build-release.ps1

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path ConkyWin.csproj -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          name: ConkyWin v${{ steps.ver.outputs.version }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/ConkyWin-${{ steps.ver.outputs.version }}-win-x64.zip
          generate_release_notes: false
          body: |
            ConkyWin v${{ steps.ver.outputs.version }}

            下载 `ConkyWin-${{ steps.ver.outputs.version }}-win-x64.zip`，解压后双击 `ConkyWin.exe` 即可运行，无需安装 .NET。

            自包含单文件发行包（.NET 8 运行时已打包进 exe），适用于 Windows 10/11 x64。
            详细说明与配置方法见仓库 README。
